name: Build Release Binaries

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            output: tv-media-conv-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            output: tv-media-conv-linux-arm64
          - os: windows-latest
            target: bun-windows-x64
            output: tv-media-conv-windows-x64.exe
          - os: macos-latest
            target: bun-darwin-x64
            output: tv-media-conv-darwin-x64
          - os: macos-14
            target: bun-darwin-arm64
            output: tv-media-conv-darwin-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.x"

      - name: Install dependencies
        run: bun install

      - name: Build for ${{ matrix.target }}
        run: bun build --compile --target=${{ matrix.target }} index.ts --outfile ${{ matrix.output }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ./artifacts

      - name: Display structure of downloaded files
        run: ls -R ./artifacts

      - name: Upload binaries to release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          files: ./artifacts/*/tv-media-conv*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
