name: Build Release Binaries

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            output: tv-media-conv-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            output: tv-media-conv-linux-arm64
          - os: windows-latest
            target: bun-windows-x64
            output: tv-media-conv-windows-x64.exe
          - os: macos-latest
            target: bun-darwin-x64
            output: tv-media-conv-darwin-x64
          - os: macos-14
            target: bun-darwin-arm64
            output: tv-media-conv-darwin-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.x"

      - name: Install dependencies
        run: bun install

      - name: Build for ${{ matrix.target }}
        run: bun build --compile --target=${{ matrix.target }} index.ts --outfile ${{ matrix.output }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display structure of downloaded files
        run: ls -R ./artifacts

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*/tv-media-conv*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
